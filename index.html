<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absen Juri - Tes Lisan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --hijau: #1a6b4a;
    --hijau-muda: #2e9b6e;
    --hijau-pale: #e8f5f0;
    --emas: #c8952a;
    --emas-pale: #fef8ed;
    --merah: #c0392b;
    --merah-pale: #fdf0ee;
    --abu: #64748b;
    --abu-pale: #f1f5f9;
    --putih: #ffffff;
    --teks: #1e293b;
    --border: #e2e8f0;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #f0f4f8;
    color: var(--teks);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--hijau) 0%, #0f4f35 100%);
    color: white;
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-lg);
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px 10px;
  }
  .logo-icon {
    width: 44px; height: 44px;
    background: rgba(255,255,255,0.15);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .header-title { font-size: 18px; font-weight: 700; line-height: 1.2; }
  .header-sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }
  .header-stats {
    display: flex;
    background: rgba(0,0,0,0.15);
    padding: 10px 20px;
    gap: 0;
  }
  .stat-item {
    flex: 1; text-align: center;
    border-right: 1px solid rgba(255,255,255,0.15);
  }
  .stat-item:last-child { border-right: none; }
  .stat-num { font-size: 22px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 10px; opacity: 0.75; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-item.hadir .stat-num { color: #7effc4; }
  .stat-item.izin .stat-num { color: #ffd97e; }
  .stat-item.alpa .stat-num { color: #ff8a80; }

  /* NAV TABS */
  .nav-tabs {
    display: flex;
    background: white;
    border-bottom: 2px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
    position: sticky;
    top: 112px;
    z-index: 90;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex-shrink: 0;
    padding: 12px 18px;
    border: none;
    background: none;
    font-size: 13px;
    font-weight: 500;
    color: var(--abu);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab-btn.active {
    color: var(--hijau);
    border-bottom-color: var(--hijau);
    font-weight: 600;
  }
  .tab-btn:hover:not(.active) { color: var(--teks); background: var(--abu-pale); }

  /* MAIN CONTENT */
  .main { padding: 16px; max-width: 700px; margin: 0 auto; }

  /* SEARCH BAR */
  .search-wrap {
    position: relative;
    margin-bottom: 14px;
  }
  .search-input {
    width: 100%;
    padding: 12px 16px 12px 44px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 14px;
    background: white;
    color: var(--teks);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: var(--shadow);
  }
  .search-input:focus { border-color: var(--hijau); box-shadow: 0 0 0 3px rgba(26,107,74,0.1); }
  .search-icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--abu);
    font-size: 16px;
  }

  /* FILTER ROW */
  .filter-row {
    display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: white;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    color: var(--abu);
  }
  .filter-btn.active { background: var(--hijau); color: white; border-color: var(--hijau); }
  .filter-btn:hover:not(.active) { border-color: var(--hijau); color: var(--hijau); }

  /* JURI CARD */
  .juri-list { display: flex; flex-direction: column; gap: 8px; }
  .juri-card {
    background: white;
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: var(--shadow);
    border: 1.5px solid transparent;
    transition: all 0.2s;
    cursor: pointer;
  }
  .juri-card:hover { border-color: var(--hijau-muda); transform: translateY(-1px); }
  .juri-card.hadir { border-left: 4px solid #2e9b6e; }
  .juri-card.izin { border-left: 4px solid var(--emas); }
  .juri-card.alpa { border-left: 4px solid var(--merah); }

  .avatar {
    width: 46px; height: 46px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 16px;
    flex-shrink: 0;
    background: var(--hijau-pale);
    color: var(--hijau);
  }
  .juri-card.hadir .avatar { background: var(--hijau-pale); color: var(--hijau); }
  .juri-card.izin .avatar { background: var(--emas-pale); color: var(--emas); }
  .juri-card.alpa .avatar { background: var(--merah-pale); color: var(--merah); }

  .juri-info { flex: 1; min-width: 0; }
  .juri-nama { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .juri-meta { font-size: 12px; color: var(--abu); margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; }
  .badge-id {
    background: var(--abu-pale);
    border-radius: 6px;
    padding: 1px 7px;
    font-size: 11px;
    font-weight: 500;
    color: var(--abu);
    font-family: monospace;
  }

  .status-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .status-badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .status-badge.hadir { background: #dcfce7; color: #166534; }
  .status-badge.izin { background: #fef3c7; color: #92400e; }
  .status-badge.alpa { background: #fee2e2; color: #991b1b; }
  .status-badge.belum { background: var(--abu-pale); color: var(--abu); }

  .btn-group { display: flex; gap: 5px; }
  .btn-absen {
    padding: 5px 10px;
    border-radius: 8px;
    border: 1.5px solid;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-hadir { border-color: var(--hijau-muda); color: var(--hijau); background: white; }
  .btn-hadir:hover, .btn-hadir.aktif { background: var(--hijau); color: white; }
  .btn-izin { border-color: var(--emas); color: var(--emas); background: white; }
  .btn-izin:hover, .btn-izin.aktif { background: var(--emas); color: white; }
  .btn-alpa { border-color: var(--merah); color: var(--merah); background: white; }
  .btn-alpa:hover, .btn-alpa.aktif { background: var(--merah); color: white; }

  /* SECTION LABEL */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--abu);
    padding: 6px 4px;
    margin-top: 4px;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--abu);
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 36px;
    width: 100%;
    max-width: 500px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 20px; }
  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .modal-sub { font-size: 13px; color: var(--abu); margin-bottom: 20px; }
  .modal-btn-row { display: flex; gap: 10px; }
  .modal-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
  }
  .modal-btn-hadir { background: var(--hijau); color: white; }
  .modal-btn-hadir:hover { background: #145d3d; }
  .modal-btn-izin { background: var(--emas-pale); color: var(--emas); border: 1.5px solid var(--emas); }
  .modal-btn-izin:hover { background: var(--emas); color: white; }
  .modal-btn-alpa { background: var(--merah-pale); color: var(--merah); border: 1.5px solid var(--merah); }
  .modal-btn-alpa:hover { background: var(--merah); color: white; }
  .modal-btn-cancel { background: var(--abu-pale); color: var(--abu); }
  .modal-btn-cancel:hover { background: var(--border); }
  .modal-info-row { 
    display: flex; gap: 10px; margin-bottom: 20px; 
    background: var(--abu-pale); 
    border-radius: 12px; padding: 12px 14px; 
    align-items: center;
  }
  .modal-avatar {
    width: 48px; height: 48px; border-radius: 12px;
    background: var(--hijau-pale); color: var(--hijau);
    font-size: 18px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-info-nama { font-weight: 600; font-size: 15px; }
  .modal-info-id { font-size: 12px; color: var(--abu); margin-top: 2px; }

  /* REKAP PANEL */
  .rekap-card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
  }
  .rekap-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--hijau); }
  .rekap-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .rekap-row:last-child { border-bottom: none; }
  .rekap-nama { font-size: 13px; color: var(--teks); }
  .rekap-count { font-size: 13px; font-weight: 700; }
  .progress-bar-wrap { background: var(--abu-pale); border-radius: 20px; height: 8px; margin-top: 10px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 20px; background: linear-gradient(90deg, var(--hijau), var(--hijau-muda)); transition: width 0.5s ease; }

  /* ACTION BAR */
  .action-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: white;
    padding: 12px 20px 24px;
    border-top: 1px solid var(--border);
    display: flex; gap: 10px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    z-index: 80;
  }
  .btn-reset {
    padding: 13px 18px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: white;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--abu);
  }
  .btn-export {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    border: none;
    background: var(--hijau);
    color: white;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.18s;
  }
  .btn-export:hover { background: #145d3d; }

  .pb-bar { padding-bottom: 80px; }

  /* TOAST */
  .toast {
    position: fixed;
    top: 130px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--teks);
    color: white;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s;
    z-index: 300;
    white-space: nowrap;
    pointer-events: none;

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .time-display {
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.7);

    .btn-absen { padding: 4px 7px; font-size: 10px; }

</head>

    <div class="stat-item alpa">

  </div>
  <div class="time-display" id="clockDisplay"></div>
</div>

  <button class="tab-btn" onclick="switchTab('rekap')">📊 Rekap</button>
</div>

<div class="main pb-bar">
  <div id="panelAbsen">

      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="searchInput" placeholder="Cari nama atau ID juri..." oninput="renderList()">
    </div>
    <div class="filter-row" id="filterRow"></div>
    <div id="juriList" class="juri-list"></div>
  </div>

  <div id="panelRekap" style="display:none; margin-top:14px">
    <div class="rekap-card">
      <h3>📊 Ringkasan Kehadiran</h3>
      <div class="rekap-row">
        <span class="rekap-nama">✅ Hadir</span>
        <span class="rekap-count" style="color:var(--hijau)" id="rekHadir">0</span>
      </div>
      <div class="rekap-row">
        <span class="rekap-nama">⚠️ Izin</span>
        <span class="rekap-count" style="color:var(--emas)" id="rekIzin">0</span>
      </div>
      <div class="rekap-row">
        <span class="rekap-nama">❌ Alpa</span>
        <span class="rekap-count" style="color:var(--merah)" id="rekAlpa">0</span>
      </div>
      <div class="rekap-row">
        <span class="rekap-nama">⬜ Belum Absen</span>
        <span class="rekap-count" style="color:var(--abu)" id="rekBelum">0</span>
      </div>
      <div style="margin-top:14px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <span style="font-size:12px;color:var(--abu)">Progress kehadiran</span>
          <span style="font-size:12px;font-weight:700;color:var(--hijau)" id="rekPersen">0%</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="rekBar" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div class="rekap-card">
      <h3>🕐 Log Absensi Terakhir</h3>
      <div id="logList" style="font-size:13px;color:var(--abu);line-height:2"></div>
    </div>
  </div>
</div>

<div class="action-bar">
  <button class="btn-reset" onclick="confirmReset()">🔄 Reset</button>
  <button class="btn-export" onclick="exportCSV()">📥 Ekspor CSV</button>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-info-row">
      <div class="modal-avatar" id="modalAvatar"></div>
      <div>
        <div class="modal-info-nama" id="modalNama"></div>
        <div class="modal-info-id" id="modalId"></div>
      </div>
    </div>
    <div class="modal-title">Tandai Kehadiran</div>
    <div class="modal-sub">Pilih status kehadiran untuk juri ini</div>
    <div class="modal-btn-row" style="margin-bottom:10px">
      <button class="modal-btn modal-btn-hadir" onclick="absenFromModal('hadir')">✅ Hadir</button>
      <button class="modal-btn modal-btn-izin" onclick="absenFromModal('izin')">⚠️ Izin</button>
    </div>
    <div class="modal-btn-row">
      <button class="modal-btn modal-btn-alpa" onclick="absenFromModal('alpa')">❌ Alpa</button>
      <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Batal</button>
    </div>
  </div>
</div>

<div class="toast" id="toastEl"></div>

// Build master data
const juriData = rawJuri.map(([no, id, nama, hp]) => ({
  no, id, nama: nama.trim(), hp,
  status: 'belum',
  waktu: null,
}));

let modalTarget = null;
let currentTab = 'semua';
let logAbsen = [];

// ============================================================
// CLOCK
// ============================================================
function updateClock() {
  const now = new Date();
  const options = { weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' };
  document.getElementById('clockDisplay').textContent = now.toLocaleString('id-ID', options);
}
updateClock();
setInterval(updateClock, 1000);

// ============================================================
// RENDER
// ============================================================
function getInitials(nama) {
  return nama.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  return juriData.filter(j => {
    const matchQ = !q || j.nama.toLowerCase().includes(q) || String(j.id).includes(q);
    const matchTab = currentTab === 'semua' || j.status === currentTab;
    return matchQ && matchTab;
  });
}

function renderList() {
  const list = document.getElementById('juriList');
  const filtered = getFiltered();
  updateStats();

  if (!filtered.length) {
    list.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>Tidak ada juri ditemukan</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(j => {
    const init = getInitials(j.nama);
    const statusLabel = { hadir:'✅ Hadir', izin:'⚠️ Izin', alpa:'❌ Alpa', belum:'Belum Absen' }[j.status];
    const timeStr = j.waktu ? `<span style="font-size:10px;color:var(--abu)">· ${j.waktu}</span>` : '';
    return `
    <div class="juri-card ${j.status}" onclick="openModal(${j.id})">
      <div class="avatar">${init}</div>
      <div class="juri-info">
        <div class="juri-nama">${j.nama}</div>
        <div class="juri-meta">
          <span class="badge-id">${j.id}</span>
          ${j.hp ? `<span>📱 ${j.hp}</span>` : ''}
        </div>
      </div>
      <div class="status-actions">
        <span class="status-badge ${j.status}">${statusLabel}</span>
        ${timeStr}
        <div class="btn-group" onclick="event.stopPropagation()">
          <button class="btn-absen btn-hadir ${j.status==='hadir'?'aktif':''}" onclick="quickAbsen(${j.id},'hadir')">H</button>
          <button class="btn-absen btn-izin ${j.status==='izin'?'aktif':''}" onclick="quickAbsen(${j.id},'izin')">I</button>
          <button class="btn-absen btn-alpa ${j.status==='alpa'?'aktif':''}" onclick="quickAbsen(${j.id},'alpa')">A</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function updateStats() {
  const counts = { hadir:0, izin:0, alpa:0, belum:0 };
  juriData.forEach(j => counts[j.status]++);
  document.getElementById('statHadir').textContent = counts.hadir;
  document.getElementById('statIzin').textContent = counts.izin;
  document.getElementById('statAlpa').textContent = counts.alpa;
  document.getElementById('statBelum').textContent = counts.belum;
}

// ============================================================
// TAB
// ============================================================
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.remove('active'));
  const tabs = ['semua','belum','hadir','izin','alpa','rekap'];
  const idx = tabs.indexOf(tab);
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');

  if (tab === 'rekap') {
    document.getElementById('panelAbsen').style.display = 'none';
    document.getElementById('panelRekap').style.display = 'block';
    renderRekap();
  } else {
    document.getElementById('panelAbsen').style.display = 'block';
    document.getElementById('panelRekap').style.display = 'none';
    renderList();
  }
}

// ============================================================
// REKAP
// ============================================================
function renderRekap() {
  const counts = { hadir:0, izin:0, alpa:0, belum:0 };
  juriData.forEach(j => counts[j.status]++);
  const total = juriData.length;
  const persen = total ? Math.round((counts.hadir / total) * 100) : 0;

  document.getElementById('rekHadir').textContent = counts.hadir;
  document.getElementById('rekIzin').textContent = counts.izin;
  document.getElementById('rekAlpa').textContent = counts.alpa;
  document.getElementById('rekBelum').textContent = counts.belum;
  document.getElementById('rekPersen').textContent = persen + '%';
  document.getElementById('rekBar').style.width = persen + '%';

  const logEl = document.getElementById('logList');
  if (!logAbsen.length) {
    logEl.innerHTML = '<span style="color:var(--abu)">Belum ada log absensi</span>';
    return;
  }
  logEl.innerHTML = logAbsen.slice().reverse().slice(0, 20).map(l => {
    const dot = { hadir:'🟢', izin:'🟡', alpa:'🔴' }[l.status];
    return `<div style="padding:5px 0;border-bottom:1px solid var(--border)">${dot} <b>${l.nama}</b> — ${l.status.toUpperCase()} <span style="float:right;font-size:11px">${l.waktu}</span></div>`;
  }).join('');
}

// ============================================================
// ABSEN ACTIONS
// ============================================================
function quickAbsen(id, status) {
  const j = juriData.find(x => x.id === id);
  if (!j) return;
  const now = new Date();
  const timeStr = now.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit' });
  
  if (j.status === status) {
    j.status = 'belum';
    j.waktu = null;
    showToast(`${j.nama} dikembalikan ke Belum Absen`);
    logAbsen = logAbsen.filter(l => l.id !== id || l.status !== status);
  } else {
    j.status = status;
    j.waktu = timeStr;
    const label = { hadir:'HADIR', izin:'IZIN', alpa:'ALPA' }[status];
    showToast(`${j.nama} — ${label} · ${timeStr}`);
    logAbsen.push({ id, nama: j.nama, status, waktu: timeStr });
  }
  renderList();
}

// ============================================================
// MODAL
// ============================================================
function openModal(id) {
  modalTarget = id;
  const j = juriData.find(x => x.id === id);
  document.getElementById('modalNama').textContent = j.nama;
  document.getElementById('modalId').textContent = `ID: ${j.id}${j.hp ? ' · ' + j.hp : ''}`;
  document.getElementById('modalAvatar').textContent = getInitials(j.nama);
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('show');
    modalTarget = null;
  }
}

function absenFromModal(status) {
  if (!modalTarget) return;
  quickAbsen(modalTarget, status);
  closeModal();
}

// ============================================================
// EXPORT CSV
// ============================================================
function exportCSV() {
  const now = new Date();
  const tgl = now.toLocaleDateString('id-ID');
  const rows = [['NO','ID JURI','NAMA','NO HP','STATUS','WAKTU ABSEN','TANGGAL']];
  juriData.forEach(j => {
    rows.push([j.no, j.id, j.nama, j.hp, j.status.toUpperCase(), j.waktu || '-', tgl]);
  });
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `absen_juri_${tgl.replace(/\//g,'_')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV berhasil diunduh!');
}

// ============================================================
// RESET
// ============================================================
function confirmReset() {
  if (confirm('Reset semua absensi? Data akan dihapus.')) {
    juriData.forEach(j => { j.status = 'belum'; j.waktu = null; });
    logAbsen = [];
    renderList();
    showToast('Absensi direset');
  }
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toastEl');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================================
// INIT
// ============================================================
renderList();
updateStats();
</script>
